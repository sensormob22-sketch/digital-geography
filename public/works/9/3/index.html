/* Context-aware inverse styles: the live placement guide stays readable over rain bars. */
.graph .hoverline.over-rain{stroke:#fff;stroke-width:3.4;opacity:1;filter:drop-shadow(0 1px 2px #143f64)}
.graph .hoverdot.over-rain{fill:#123e59;stroke:#fff;stroke-width:3.2;filter:drop-shadow(0 1px 2px #143f64)}
.graph .hover-reading{fill:#0d8189;font-size:14px;font-weight:850;paint-order:stroke fill;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}

/* Fixed temperature labels: white numerals with orange outline, visible over blue precipitation bars. */
.graph .placed-temp-reading{fill:#fff;stroke:#e16f49;stroke-width:3.8px;stroke-linejoin:round;paint-order:stroke fill;font-size:13px;font-weight:850;filter:drop-shadow(0 1px 1px #6f453780);pointer-events:none}

/* Consistent typography inside the climograph (axes, ticks, months, all readings and guides). */
.graph text,
.graph .axis-label,
.graph .tick,
.graph .month-lbl,
.graph .month-lbl.selected,
.graph .wind-label,
.graph .hover-reading,
.graph .placed-temp-reading {
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
/* Color alone differentiates the measured series. Every reading has the same weight and size. */
.graph .rain-reading {
  fill: #256f99;
  paint-order: stroke fill;
  stroke: #ffffff;
  stroke-width: 2px;
  stroke-linejoin: round;
  pointer-events: none;
}
.graph .placed-temp-reading {
  fill: #ffffff;
  stroke: #d96943;
  stroke-width: 2.9px;
  stroke-linejoin: round;
  paint-order: stroke fill;
  filter: drop-shadow(0 1px 1px #7e4a3d55);
}
.graph .wind-label {
  fill: #263d6b;
  paint-order: stroke fill;
  stroke: #f4faff;
  stroke-width: 2px;
  stroke-linejoin: round;
}
.graph .month-lbl.selected {font-weight:700;}
.graph .hover-reading {font-weight:700;}
.graph .hover-reading.over-rain {stroke:none;}
.graph .chart-footer {fill:#718790;}

/* bilingual five-city improvements */
.settings{display:flex;align-items:end;gap:9px;flex-wrap:wrap;margin:0 0 15px;padding:13px 17px}.field{display:flex;flex-direction:column;gap:5px;min-width:170px}.field.city{flex:1;max-width:360px}.field label{font-size:.73rem;font-weight:800;color:#5c7880}.field select{appearance:auto;background:#fff;border:1px solid #c5dddb;color:var(--ink);padding:10px 11px;border-radius:11px;font-weight:700;min-height:42px}.lang-switch{border:1px solid #d0e4e4;border-radius:12px;padding:4px;display:flex;gap:3px;background:#f6faf9}.lang-switch button{border:0;background:transparent;color:#587a7e;border-radius:9px;min-height:35px;min-width:44px;font-weight:800}.lang-switch button.selected{background:#188da1;color:#fff;box-shadow:0 2px 7px #12748930}.period-note{margin-left:auto;max-width:450px;align-self:center;font-size:.77rem;color:#617985}.source-line{margin-top:10px;font-size:.77rem;line-height:1.55;color:#627a85}.source-line a{font-weight:700}.source-label{font-weight:800;color:#4a6f77}.site-pill{max-width:420px;border-radius:12px;text-wrap:balance}.wind-note{background:#f8f6ec;border:1px solid #eee1bc;padding:9px 12px;border-radius:12px;font-size:.78rem;margin-top:11px;color:#6d6349}.progress-info{font-variant-numeric:tabular-nums}.wind-var{font-weight:800}.city-line{color:#67868b;font-size:.78rem;margin-top:2px}.graph .temp-path{stroke-width:3.2}.graph .wind-arrow{stroke-width:3}.graph .pulse-error.wind-label{fill:#b52f52}.source-line a:focus-visible{outline:2px solid #168c9e}.footer-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}.pill-warning{display:inline-flex;padding:3px 7px;border-radius:20px;background:#fff1d9;color:#886120;font-size:.72rem;font-weight:750}

/* Unified assessment: one check at the end of all ten tasks */
.graph-corrections{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;margin-top:11px}
.graph-corrections[hidden]{display:none!important}
.graph-fix{border:1px solid #edbdc8;background:#fff6f7;color:#9d3047;border-radius:11px;padding:9px 11px;min-height:52px;text-align:left;font-size:.80rem;font-weight:700;cursor:pointer;line-height:1.4}
.graph-fix strong{display:block;font-size:.76rem;color:#b52e49}
.graph-fix:hover,.graph-fix:focus-visible{background:#ffe5e9;border-color:#d76477}
.graph-fix .wrong-value{text-decoration:line-through;opacity:.75;font-weight:600}
.graph-fix .true-value{color:#bb1f3d;font-weight:900}
/* Tasks 2–10 and final assessment */
.wind-question-note{font-size:.82rem;line-height:1.42;color:var(--muted);margin:0 0 12px}

[hidden]{display:none!important}
.exercise{margin-top:19px;padding:23px clamp(15px,2vw,28px) 26px;scroll-margin-top:16px}
.exercise-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.exercise-header h2{font-size:clamp(1.15rem,2vw,1.55rem);margin:4px 0;letter-spacing:-.025em}
.exercise-lead{font-size:.88rem;color:var(--muted);margin:5px 0 0;max-width:820px}
.section-status{font-size:.79rem;font-weight:800;color:#387e83;border-radius:100px;padding:8px 12px;border:1px solid #cfe9e6;background:#ebf9f5;white-space:nowrap}
.exercise-lock{display:flex;align-items:center;gap:12px;padding:22px;margin-top:18px;background:#f4f8f7;border:1px dashed #cbdedc;border-radius:15px;color:#607780}
.exercise-lock .lock-icon{font-size:1.7rem;flex:none}
.q-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px}
.q-card{border-radius:17px;border:1px solid #dde9e9;background:linear-gradient(125deg,#fff 72%,#f8fcfc);padding:17px;box-shadow:0 5px 15px #2049520a;min-width:0}
.q-top{display:flex;align-items:flex-start;gap:11px;margin-bottom:13px}
.q-number{display:grid;place-items:center;flex:none;width:33px;height:33px;border-radius:12px;color:#1b7c87;background:#e3f5f2;font-weight:850;font-size:.95rem}
.q-title{font-weight:800;font-size:.97rem;margin:2px 0 0;line-height:1.4;max-width:100%}
.q-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.q-card.wide-answer .q-fields{grid-template-columns:1fr}
.answer-field{position:relative;min-width:0;border:1px solid transparent;border-radius:13px;padding:3px;transition:box-shadow .15s,border-color .15s}
.answer-field label{font-size:.79rem;color:#607680;font-weight:760;display:block;margin-bottom:7px}
.answer-field select,.answer-field input{display:block;width:100%;min-height:45px;border-radius:11px;border:1px solid #c8dedf;background:#fff;color:#173b48;padding:9px 12px;min-width:0;appearance:auto}
.answer-field input{font-variant-numeric:tabular-nums}
.answer-field select:focus-visible,.answer-field input:focus-visible{outline:3px solid #a8d9dc;outline-offset:1px}
.answer-field.is-wrong{border-color:#ef6d7b;background:#fff2f3;animation:answerPulse 1.3s ease-in-out infinite}
.answer-field.is-wrong select,.answer-field.is-wrong input{border-color:#db566e;color:#9d233b}
.answer-field.is-correct select,.answer-field.is-correct input{border-color:#6cbea5;background:#f6fcf9}

/* Automatic SVG annotation arrangement. The measured points, heights and wind bearings are
   never altered. Only label baselines and weather-vane glyph positions can shift. */
function annotationBox(x,baseline,width,height=17){return {x:x-width/2,y:baseline-height+3,w:width,h:height};}
function boxOverlap(a,b,gap=3){return Math.max(0,Math.min(a.x+a.w+gap,b.x+b.w+gap)-Math.max(a.x-gap,b.x))*Math.max(0,Math.min(a.y+a.h+gap,b.y+b.h+gap)-Math.max(a.y-gap,b.y));}
function annotationWidth(text,kind){
  // All labels use the same Segoe UI 13px / 700-weight typography.
  const cap=kind==='temp'?8.1:kind==='wind'?8.6:8.1;
  return Math.max(21,[...String(text)].reduce((sum,ch)=>sum+(ch==='1'?6.1:ch===','||ch==='.'?4.5:ch==='−'||ch==='-'?5.5:cap),0)+8);
}
function bestAnnotation(anchor,candidates,occupied,width,height=17,limits=null){
  const region=limits||{left:PT.x+4,right:PT.x+PT.w-4,top:47,bottom:B+7};
  let best=null;
  for(let i=0;i<candidates.length;i++){
    let [dx,dy]=candidates[i],x=anchor.x+dx,y=anchor.y+dy;
    let box=annotationBox(x,y,width,height);
    const outside=Math.max(0,region.left-box.x)+Math.max(0,box.x+box.w-region.right)+Math.max(0,region.top-box.y)+Math.max(0,box.y+box.h-region.bottom);
    const overlap=occupied.reduce((sum,other)=>sum+boxOverlap(box,other),0);
    const score=outside*900+overlap*65+Math.hypot(dx,dy)*.26+i*.2;
    if(!best||score<best.score)best={x,y,box,score,dx,dy};
    if(outside===0&&overlap===0)break;
  }
  occupied.push(best.box);
  return best;
}
function annotationLeader(anchor,label,color){
  const cx=label.x,cy=label.box.y+label.box.h/2;
  if(Math.hypot(cx-anchor.x,cy-anchor.y)<26)return '';
  return `<line x1="${anchor.x}" y1="${anchor.y}" x2="${cx}" y2="${cy}" stroke="${color}" stroke-width="1.3" opacity=".66" stroke-dasharray="2 3" pointer-events="none"/>`;
}
function calculateWindGlyph(x,barTop,tempY,variable,occupied,hoverBox){
  const depth=Math.max(0,B-barTop),hh=variable?14:14,hw=variable?20:13;
  const defaultY=B-clamp(depth*.5,10,85);
  const candidates=[defaultY];
  if(depth>31){
    for(const step of [18,-18,35,-35,52,-52,70,-70,90,-90]){
      const y=clamp(defaultY+step,barTop+hh+1,B-hh-1);
      if(!candidates.some(v=>Math.abs(y-v)<2))candidates.push(y);
    }
  }
  let best=null;
  for(const y of candidates){
    let box={x:x-hw-3,y:y-hh-3,w:2*hw+6,h:2*hh+6};
    const outside=(depth>=32?Math.max(0,barTop+hh-y)+Math.max(0,y-(B-hh)):0);
    const overlap=occupied.reduce((sum,item)=>sum+boxOverlap(box,item,2),0);
    const score=outside*1000+overlap*70+Math.abs(y-defaultY)*.55;
    if(best===null||score<best.score)best={x,y,box,score};
    if(score===0)break;
  }
  occupied.push(best.box);
  return best;
}

<script>
/* Move original controls with their listeners; never duplicate values or alter assessment. */
(()=>{
  const run=()=>{
    const controls=document.querySelector('section.controls');
    const workspace=document.querySelector('section.workspace');
    if(!controls||!workspace)return;
    const heading=controls.querySelector('[data-i18n="instrumentHeading"]');
    const shortHelp=controls.querySelector('.instrument-short-help');
    const instruments=controls.querySelector('.instrument-list');
    const instructions=controls.querySelector('.instructions');
    const resetButtons=controls.querySelector('.buttons-row');
    const introTitle=instructions?.querySelector('[data-i18n="howTo"]');
    const introParent=introTitle?.parentNode;
    const mobileBuilder=document.getElementById('mobileBuilder');
    const overview=document.getElementById('overview');
    const elems=[heading,shortHelp,instruments,instructions,resetButtons];
    if(elems.some(el=>!el)||!introTitle||!mobileBuilder||!overview)return;
    const markers=elems.map(el=>{const marker=document.createComment('original mobile station anchor');el.parentNode.insertBefore(marker,el);return marker});
    const guide=document.createElement('details');guide.className='mobile-guide';
    const summary=document.createElement('summary');
    guide.appendChild(summary);
    const copy=document.createElement('div');copy.className='mobile-guide-copy';
    guide.appendChild(copy);
    const instructionsMobile={
      ru:['Выбери месяц и прибор. По показанию на карточке выставь значение ползунком или кнопками − и +. Для флюгера выбери направление из списка. Нажми «Добавить на график».','Размести три показания и переходи к следующему месяцу. Правильность ответов проверяется только в конце всей работы.'],
      be:['Выберы месяц і прыбор. Паводле паказання на картцы ўсталюй значэнне паўзунком або кнопкамі − і +. Для флюгера выберы напрамак са спіса. Націсні «Дадаць на графік».','Размясці тры паказанні і пераходзь да наступнага месяца. Правільнасць адказаў правяраецца толькі ў канцы ўсёй работы.'],
      en:['Choose a month and an instrument. Match the reading shown on its card using the slider or − / +. For the weather vane, select a direction. Tap “Add to graph”.','Place all three readings, then move on to the next month. Answers are checked only at the end of the entire exercise.']
    };
    const refreshHelp=()=>{const lang=document.querySelector('[data-language].selected')?.dataset.language||'ru';copy.replaceChildren(...(instructionsMobile[lang]||instructionsMobile.ru).map(t=>{const p=document.createElement('p');p.textContent=t;return p}));};
    document.querySelectorAll('[data-language]').forEach(btn=>btn.addEventListener('click',refreshHelp));
    refreshHelp();
    let small=false;
    const move=()=>{
      const mobile=window.matchMedia('(max-width:780px)').matches;
      if(mobile===small)return;
      small=mobile;
      if(mobile){
        controls.insertBefore(guide,controls.firstChild);
        summary.appendChild(introTitle);
        guide.appendChild(instructions);
        mobileBuilder.before(heading,shortHelp,instruments);
        overview.after(resetButtons);
      }else{
        elems.forEach((el,i)=>markers[i].after(el));
        introParent.insertBefore(introTitle,introParent.firstChild);
        guide.remove();
      }
    };
    if(window.matchMedia('(max-width:780px)').matches)move();
    window.matchMedia('(max-width:780px)').addEventListener('change',move);
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();
</script>

  ctx.fillStyle=wrong?'#ffe2e7':'#ffffff';ctx.fill();
  ctx.lineWidth=wrong?4:3;ctx.strokeStyle=wrong?pal.red:'#d76643';ctx.stroke();
  txt(ctx,String(row.values.temp).replace(' °C',''),mid,ty-13,17,wrong?pal.red:'#a64a35',wrong,'center');
  const isBadWind=err(i,'wind'),py=ybot-24;
  round(ctx,mid-27,py-10,54,26,8,isBadWind?pal.softRed:'#edf1fd',isBadWind?pal.red:null);
  txt(ctx,String(row.values.wind),mid,py+9,16,isBadWind?pal.red:'#354881',isBadWind,'center');
 });
}
function firstPage(r,t){
 const p=canvasPage(),ctx=p.ctx;pageHead(ctx,r,t,1);
 txt(ctx,t.graph,PAD,236,30,pal.navy,true);
 const chartX=PAD+72,chartY=330,chartW=W-2*PAD-142,chartH=468;
 plot(ctx,r,chartX,chartY,chartW,chartH,t);
 txt(ctx,t.table,PAD,936,30,pal.navy,true);
 const headY=962;
 round(ctx,PAD,headY,W-2*PAD,49,9,pal.soft);
 const col=[PAD+17,PAD+283,PAD+537,PAD+781,PAD+1064];
 [t.month,t.rain,t.temp,t.wind,t.verdict].forEach((v,i)=>txt(ctx,v,col[i],headY+32,21,pal.navy,true));
 r.readings.forEach((row,i)=>{
  const yy=headY+49+i*62,bad=Object.values(row.errors).some(Boolean);
  ctx.fillStyle=bad?pal.softRed:i%2?'#f7fafa':'#ffffff';
  ctx.fillRect(PAD,yy,W-2*PAD,62);
  if(bad){ctx.fillStyle=pal.red;ctx.fillRect(PAD,yy,5,62)}
  txt(ctx,row.month,col[0],yy+39,21,pal.navy,true);
  ['rain','temp','wind'].forEach((k,j)=>{
   const value=row.values[k];const wrong=row.errors[k];
   txt(ctx,fit(ctx,value,j===2?260:230,22,wrong),col[j+1],yy+39,22,wrong?pal.red:pal.navy,wrong);
  });
  txt(ctx,bad?t.wrong:t.correct,col[4],yy+39,20,bad?pal.red:pal.green,bad);
  ctx.fillStyle=pal.line;ctx.fillRect(PAD,yy+61,W-2*PAD,1);
 });
 txt(ctx,t.note,PAD,1847,22,pal.muted);
 return p.cv;
}
function secondPage(r,t){
 const p=canvasPage(),ctx=p.ctx;pageHead(ctx,r,t,2);
 txt(ctx,t.analysis,PAD,239,32,pal.navy,true);
 const start=267,rowH=99;
 r.tasks.forEach((row,i)=>{
  const y=start+i*rowH,bad=row.wrong;
  round(ctx,PAD,y,W-2*PAD,rowH-8,12,bad?pal.softRed:i%2?'#f8fbfb':'#ffffff',bad?'#e6b2bb':pal.line);
  round(ctx,PAD+15,y+12,49,41,10,bad?'#f9d5dc':'#e1f2f2');
  txt(ctx,row.number||'-',PAD+39,y+41,22,bad?pal.red:pal.teal,true,'center');
  txt(ctx,fit(ctx,row.label+' · '+row.question,785,21,true),PAD+77,y+35,21,pal.navy,true);
  txt(ctx,fit(ctx,row.actual,550,23,bad),PAD+77,y+70,23,bad?pal.red:pal.navy,bad);
  if(bad)txt(ctx,fit(ctx,t.right+': '+row.correct,535,19,true),W-PAD-16,y+70,19,pal.red,true,'right');
  else txt(ctx,t.correct,W-PAD-22,y+66,21,pal.green,true,'right');
 });
 const y=1710;round(ctx,PAD,y,W-2*PAD,181,18,pal.soft);
 txt(ctx,t.total,PAD+29,y+51,31,pal.navy,true);
 txt(ctx,t.errors+': '+r.mistakes,PAD+29,y+101,31,r.mistakes?pal.red:pal.green,true);
 txt(ctx,t.accuracy+': '+r.accuracy+'%',W-PAD-29,y+101,32,pal.navy,true,'right');
 txt(ctx,String(r.chartCount+r.taskCount-r.mistakes)+' '+t.of+' '+String(r.chartCount+r.taskCount),PAD+29,y+150,22,pal.muted);
 return p.cv;
}
function pdfFile(canvases){
 const te=new TextEncoder(),parts=[],offsets=[0];let pos=0;
 const write=b=>{parts.push(b);pos+=b.length};
 const a=s=>write(te.encode(s));
 a('%PDF-1.4\n%METEOLAB\n');
 const total=2+3*canvases.length;
 const object=(id,blocks)=>{offsets[id]=pos;a(id+' 0 obj\n');for(const b of blocks){if(typeof b==='string')a(b);else write(b)}a('\nendobj\n')};
 object(1,['<< /Type /Catalog /Pages 2 0 R >>']);
 object(2,['<< /Type /Pages /Kids ['+canvases.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+canvases.length+' >>']);
 canvases.forEach((cv,i)=>{
  const id=3+i*3,stream='q\n595.276 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n';
  const binary=atob(cv.toDataURL('image/jpeg',.93).split(',')[1]),jpg=new Uint8Array(binary.length);
  for(let j=0;j<binary.length;j++)jpg[j]=binary.charCodeAt(j);
  object(id,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.276 841.89] /Resources << /XObject << /Im0 '+(id+2)+' 0 R >> >> /Contents '+(id+1)+' 0 R >>']);
  object(id+1,['<< /Length '+te.encode(stream).length+' >>\nstream\n',stream,'endstream']);
  object(id+2,['<< /Type /XObject /Subtype /Image /Width '+cv.width+' /Height '+cv.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n',jpg,'\nendstream']);
 });
 const xref=pos;a('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
 for(let i=1;i<=total;i++)a(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 a('trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'});
}
const generate=async()=>{const r=window.Meteolab.getReportData(),t=dict[r.lang]||dict.ru;
 if(!r.checked)throw Error(t.notReady);
 return pdfFile([firstPage(r,t),secondPage(r,t)])};
const suggestedName=r=>('MeteoLab_'+r.cityName+'_'+new Date().toISOString().slice(0,10)+'.pdf').replace(/[\\/:*?"<>|]/g,'_');
const download=(blob,name)=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)};
async function save(){
 const t=current(),r=window.Meteolab.getReportData();if(!r.checked){alert(t.notReady);return}
 menuClose();const name=suggestedName(r);let handle=null;
 if(typeof window.showSaveFilePicker==='function'){
  try{handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}],excludeAcceptAllOption:true})}
  catch(e){if(e.name==='AbortError')return}
 }
 try{
  const blob=await generate();
  if(handle){const target=await handle.createWritable();await target.write(blob);await target.close();return}
  const input=window.prompt(t.name,name);if(input===null)return;
  const filename=(input.trim()||name).replace(/[\\/:*?"<>|]/g,'_').replace(/\.pdf$/i,'')+'.pdf';
  const file=new File([blob],filename,{type:'application/pdf'});
  if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare?.({files:[file]})){
   try{await navigator.share({files:[file],title:filename});return}catch(e){if(e.name==='AbortError')return}
  }
  download(blob,filename);
 }catch(e){console.error(e);alert(t.fail+String(e.message||e))}
}
async function shareNative(){
 const t=current(),r=window.Meteolab.getReportData();if(!r.checked){alert(t.notReady);return}
 menuClose();
 try{
  const blob=await generate(),file=new File([blob],suggestedName(r),{type:'application/pdf'});
  if(navigator.canShare?.({files:[file]})&&navigator.share)await navigator.share({files:[file],title:file.name});
  else download(blob,file.name);
 }catch(e){if(e.name!=='AbortError'){console.error(e);alert(t.fail+String(e.message||e))}}
}
['shareResult','shareSuccess'].forEach(id=>$(id).addEventListener('click',e=>{e.stopPropagation();menuToggle(e.currentTarget)}));
$('pdfSaveAction').addEventListener('click',save);
$('pdfNativeShareAction').addEventListener('click',shareNative);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#pdfShareMenu,.pdf-share-trigger'))menuClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')menuClose()});
new MutationObserver(textUpdate).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
textUpdate();window.MeteolabReport={generate,save};
})();
</script>
