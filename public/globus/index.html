function unpack(t){

  for(const ring of rings){let prev=null;
   for(let j=0;j<ring.length;j++){const pt=ring[j],x=(pt[0]+180)/360*cv.width,y=(90-pt[1])/180*cv.height;

function pointerFinish(e,cancel=false){
