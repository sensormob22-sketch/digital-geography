name: Проверка Astro и PWA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Установка зависимостей
        run: npm install --no-audit --no-fund
      - name: Тест Service Worker
        run: npm run test:sw
      - name: Проверка глобуса и переводов
        run: npm run test:globe
      - name: Проверка стартовой страницы и единого языка
        run: npm run test:home
      - name: Проверка площадных контуров и агломераций
        run: npm run test:areas
      - name: Проверка масштабирования и выделения русел и озёр
        run: npm run test:water
      - name: Сборка статического сайта
        run: npm run build
      - name: Установка браузера для визуального теста глобуса
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Визуальная проверка собранного глобуса
        env:
          EMIT_PREVIEW_BASE64: 'true'
        run: node tests/visual_globe.mjs
      - name: Снимки реальной страницы глобуса
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globe-visual-screenshots
          path: visual-output/
          if-no-files-found: warn
      - name: Публикация результата проверки
        uses: actions/upload-artifact@v4
        with:
          name: digital-geography-dist
          path: dist/
